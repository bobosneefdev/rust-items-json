name: Package

on:
  push:
    branches: [master]
    paths: ["package/**", "data/*.json", "extractor/**", "tests/**", "pyproject.toml", "uv.lock", ".github/workflows/**"]
  pull_request:
    paths: ["package/**", "data/*.json", "extractor/**", "tests/**", "pyproject.toml", "uv.lock", ".github/workflows/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv run python -m unittest discover -s tests
      - run: uv run extractor/validate.py data
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
        working-directory: package
      - run: npm run build && npm test
        working-directory: package
