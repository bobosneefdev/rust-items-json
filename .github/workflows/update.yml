name: Update data

on:
  push:
    branches: [master]
    paths: ["extractor/**", "tests/**", "scripts/**", "pyproject.toml", "uv.lock", ".github/workflows/update.yml"]
  schedule:
    # Cheap build checks every six hours; downloads happen only after a build/code change.
    - cron: "7 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Extract even if the Rust build hasn't changed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Check Rust build
        id: build
        run: |
          build=$(curl -sf https://api.steamcmd.net/v1/info/252490 | jq -r '.data["252490"].depots.branches.public.buildid')
          [ -n "$build" ] && [ "$build" != "null" ] || { echo "could not read build id"; exit 1; }
          last=$(jq -r '.build // empty' data/meta.json 2>/dev/null || true)
          echo "build=$build" >> "$GITHUB_OUTPUT"
          if [ "$build" != "$last" ] || [ "${{ inputs.force }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          echo "Rust build $build (last extracted: ${last:-none})"

      - uses: astral-sh/setup-uv@v6
        if: steps.build.outputs.changed == 'true'

      - name: Test extractors
        if: steps.build.outputs.changed == 'true'
        run: uv run python -m unittest discover -s tests

      - name: Free disk space
        if: steps.build.outputs.changed == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          # The client texture bundles are ~32 GB; put game files on the larger volume when there is one.
          if [ -d /mnt ] && [ "$(df --output=avail -B1G /mnt | tail -1)" -gt "$(df --output=avail -B1G . | tail -1)" ]; then
            sudo mkdir -p /mnt/game && sudo chown "$USER" /mnt/game && ln -s /mnt/game game
          fi
          df -h / /mnt

      - name: Install DepotDownloader
        if: steps.build.outputs.changed == 'true'
        run: |
          gh release download DepotDownloader_3.4.0 -R SteamRE/DepotDownloader -p DepotDownloader-linux-x64.zip
          unzip -q DepotDownloader-linux-x64.zip -d depotdownloader
          chmod +x depotdownloader/DepotDownloader
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download game files
        if: steps.build.outputs.changed == 'true'
        run: scripts/fetch.sh
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_SHARED_SECRET: ${{ secrets.STEAM_SHARED_SECRET }}

      - name: Extract
        if: steps.build.outputs.changed == 'true'
        run: |
          uv run extractor/main.py game/server game/client/Bundles/shared new-data
          uv run extractor/validate.py new-data
          uv run extractor/changelog.py data new-data "${{ steps.build.outputs.build }}" > notes.md
          rm -rf data/icons && mkdir -p data && cp -r new-data/. data/
          if [ -s notes.md ]; then
            { cat notes.md; echo; cat CHANGELOG.md 2>/dev/null; } > CHANGELOG.new && mv CHANGELOG.new CHANGELOG.md
          fi

      - name: Record check
        run: |
          mkdir -p data
          jq -n --arg build "${{ steps.build.outputs.build }}" --arg checked "$(date -u +%FT%TZ)" \
            --argjson prev "$(cat data/meta.json 2>/dev/null || echo '{}')" --arg changed "${{ steps.build.outputs.changed }}" \
            '$prev + {build: $build, checked: $checked} + (if $changed == "true" then {updated: $checked} else {} end)' > data/meta.json

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data CHANGELOG.md 2>/dev/null || git add data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          if [ "${{ steps.build.outputs.changed }}" = "true" ]; then msg="Rust build ${{ steps.build.outputs.build }}"; else msg="Check: no new Rust build"; fi
          git commit -q -m "$msg"
          git push

      - name: Release
        if: steps.build.outputs.changed == 'true' && hashFiles('notes.md') != ''
        run: |
          [ -s notes.md ] || exit 0
          tag="build-${{ steps.build.outputs.build }}"
          (cd data && zip -qr ../rust-data.zip .)
          gh release create "$tag" rust-data.zip --title "Rust build ${{ steps.build.outputs.build }}" --notes-file notes.md --target "$(git rev-parse HEAD)" \
            || gh release upload "$tag" rust-data.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
